<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1e3a8a">
  <title>Kiosk Antrian Dukcapil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/kiosk.css">
  <style id="page-size">@page { size: 80mm auto; margin: 0; }</style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="brand" id="brand" type="button" aria-label="Logo instansi">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M24 3 6 10v12c0 11 7.6 19.8 18 23 10.4-3.2 18-12 18-23V10L24 3Z" fill="currentColor"/><path d="M16 20h16M16 26h10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="31" cy="29" r="4" fill="#fbbf24"/></svg>
        </span>
        <span class="brand-text">
          <strong id="brand-name">DISDUKCAPIL</strong>
          <span id="brand-region">Kabupaten</span>
        </span>
      </button>
      <div class="topbar-right">
        <span class="pill" id="mode-pill" hidden></span>
        <span class="pill pill-warn" id="test-pill" hidden>MODE UJI</span>
        <div class="clock">
          <span class="clock-time" id="clock-time">--:--</span>
          <span class="clock-date" id="clock-date"></span>
        </div>
      </div>
    </header>

    <nav class="stepper" id="stepper" aria-label="Langkah" hidden></nav>

    <main class="screen" id="screen" tabindex="-1"></main>

    <footer class="a11y-bar" aria-label="Aksesibilitas">
      <button type="button" class="a11y-btn" data-action="toggle-large" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M3 19 8 5l5 14M4.8 14h6.4M15 19l3-8 3 8M15.9 16.5h4.2"/></svg>
        <span>Teks besar</span>
      </button>
      <button type="button" class="a11y-btn" data-action="toggle-contrast" aria-pressed="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18Z" fill="currentColor"/></svg>
        <span>Kontras tinggi</span>
      </button>
      <button type="button" class="a11y-btn" data-action="speak">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <span>Bacakan layar</span>
      </button>
      <button type="button" class="a11y-btn a11y-help" data-action="help">
        <svg viewBox="0 0 24 24"><path d="M7 11V6.5a1.5 1.5 0 0 1 3 0V11M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V5.5a1.5 1.5 0 0 1 3 0V12M16 9.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.6a6 6 0 0 1-4.6-2.2L3.5 14.6a1.6 1.6 0 0 1 2.4-2.1L7 13.5V11"/></svg>
        <span>Panggil petugas</span>
      </button>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="print-area" aria-hidden="true"></div>

  <script src="js/vendor/qrcode.js"></script>
  <script src="js/config.js"></script>
  <script src="js/queue-core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
