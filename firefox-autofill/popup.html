<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 280px; margin: 12px; color: #172b4d; }
    button { width: 100%; padding: 8px; margin-bottom: 6px; border: 0; border-radius: 4px; cursor: pointer; font-weight: 600; }
    #run { background: #0052cc; color: #fff; }
    #run:disabled { background: #a5adba; cursor: default; }
    #opts { background: #ebecf0; color: #172b4d; }
    #status { font-size: 12px; color: #5e6c84; margin-bottom: 8px; }
    pre { white-space: pre-wrap; font: 12px ui-monospace, monospace; background: #f4f5f7; padding: 6px; border-radius: 4px; margin: 6px 0 0; }
    pre:empty { display: none; }
  </style>
</head>
<body>
  <div id="status">Memeriksa halaman...</div>
  <button id="run" disabled>Isi Form Sekarang</button>
  <button id="opts">Pengaturan</button>
  <pre id="log"></pre>
  <script src="popup.js"></script>
</body>
</html>
